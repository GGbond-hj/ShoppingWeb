<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 生鲜购物网站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="生鲜Logo">
            <h1>生鲜购物网站</h1>
        </div>
        <nav id="navbar">
            <a href="index.html">首页</a>
            <a href="index.html#products">商品展示</a>
            <a href="cart.html">购物车</a>
            <a href="orders.html">订单管理</a>
            <a href="login.html">登录</a>
            <a href="register.html">注册</a>
        </nav>
        <div class="header-actions">
            <button id="dark-mode-toggle" type="button">夜间模式</button>
            <div id="current-date" class="current-date"></div>
            <div id="user-status"></div>
        </div>
    </header>
    <main>
        <section class="section-title">
            <h2>我的购物车</h2>
            <p>管理商品数量、删除商品或提交订单。</p>
        </section>
        <section class="cart-page">
            <div class="cart-controls">
                <label class="select-all-label">
                    <input type="checkbox" id="select-all"> 全选
                </label>
                <button id="delete-selected" type="button" class="secondary" style="display: none;">删除选中</button>
            </div>
            <div id="cart-items" class="cart-items">
                <!-- 购物车项目将通过JavaScript动态添加 -->
            </div>
            <div class="cart-summary">
                <p>总价: <span id="total-price">0</span> 元</p>
                <label for="shipping-address">收货地址:</label>
                <textarea id="shipping-address" placeholder="请输入收货地址" rows="3"></textarea>
                <div class="cart-actions">
                    <button id="checkout">提交订单</button>
                    <button id="clear-cart" type="button" class="secondary">清空购物车</button>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h4>关于我们</h4>
                <p>生鲜购物网站致力于为您提供最新鲜、最安全的生鲜食材。</p>
            </div>
            <div class="footer-section">
                <h4>快速链接</h4>
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="index.html#products">商品展示</a></li>
                    <li><a href="orders.html">订单管理</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>联系方式</h4>
                <p>电话: 400-123-4567</p>
                <p>邮箱: support@freshfood.com</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2023 生鲜购物网站. 版权所有.</p>
        </div>
    </footer>
    <div id="toast"></div>
    <script src="script.js"></script>
</body>
</html>
