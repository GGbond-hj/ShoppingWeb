<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 鲜直达 · 生鲜购物网站</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥬</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 此处满足课程要求1：HTML5 语义化标签 header -->
    <header id="main-header">
        <div class="logo">
            <img src="images/logo.png" alt="生鲜购物网站Logo" loading="lazy">
            <h1>鲜直达</h1>
        </div>
        <!-- 此处满足课程要求1：HTML5 语义化标签 nav -->
        <nav id="navbar" class="nav-menu" aria-label="主导航">
            <a href="index.html">首页</a>
            <a href="index.html#products">商品展示</a>
            <a href="cart.html" class="active">购物车<span class="cart-badge" id="cart-badge" style="display:none">0</span></a>
            <a href="orders.html">订单管理</a>
            <a href="login.html">登录</a>
            <a href="register.html">注册</a>
        </nav>
        <div class="header-actions">
            <div id="current-date" class="current-date"></div>
            <button id="dark-mode-toggle" type="button" aria-label="切换深色模式">🌙 夜间</button>
            <div id="user-status"></div>
        </div>
    </header>

    <!-- 此处满足课程要求1：HTML5 语义化标签 main -->
    <main>
        <nav class="breadcrumb" aria-label="面包屑导航">
            <a href="index.html">首页</a>
            <span>/ 购物车</span>
        </nav>

        <!-- 此处满足课程要求1：使用 section 语义标签 -->
        <section class="section-header">
            <h2>🛒 我的购物车</h2>
            <p>管理商品数量、选择配送地址，确认后提交订单</p>
        </section>

        <section class="cart-page" aria-label="购物车内容">
            <!-- 全选/删除控件 -->
            <div class="cart-controls">
                <label class="select-all-label">
                    <input type="checkbox" id="select-all"> 全选
                </label>
                <button id="delete-selected" type="button" class="secondary" style="display:none;">🗑️ 删除选中</button>
            </div>

            <!-- 此处满足课程要求7-免运费进度条：CSS动画进度条 -->
            <div class="free-shipping-bar" id="free-shipping-bar">
                <div class="progress-text">💡 满¥39享免运费</div>
                <div class="progress-track"><div class="progress-fill" style="width:0%"></div></div>
            </div>

            <!-- 购物车商品列表 -->
            <div id="cart-items" class="cart-items">
                <!-- JS 动态渲染购物车商品 -->
            </div>

            <!-- 汇总区域 -->
            <div class="cart-summary">
                <p style="font-size:1.15rem;font-weight:700;">💰 总价：<span id="total-price" style="color:#E53935;">0.00</span> 元</p>
                <label for="shipping-address">📍 收货地址：</label>
                <textarea id="shipping-address" placeholder="请输入详细收货地址（省/市/区/街道/门牌号）" rows="3"></textarea>
                <div class="cart-actions">
                    <button id="checkout" class="primary">📦 提交订单</button>
                    <button id="clear-cart" type="button" class="secondary">🗑️ 清空购物车</button>
                </div>
            </div>
        </section>
    </main>

    <!-- 此处满足课程要求7-底部固定结算栏：全选 + 合计 + 去结算 -->
    <div class="cart-sticky-bar" id="cart-sticky-bar">
        <label class="select-all-label">
            <input type="checkbox" id="select-all-sticky" onchange="document.getElementById('select-all').checked = this.checked; toggleSelectAll();"> 全选
        </label>
        <span class="total-label">合计：</span>
        <span class="total-amount" id="sticky-total">0.00</span>
        <button class="btn-checkout" type="button" onclick="showOrderConfirmModal()">去结算</button>
    </div>

    <!-- 此处满足课程要求1：HTML5 语义化标签 footer -->
    <!-- 此处满足课程要求6：版权信息 -->
    <footer role="contentinfo">
        <div class="footer-content">
            <div class="footer-section">
                <h4>🥬 关于鲜直达</h4>
                <p>鲜直达致力于为您提供最新鲜、最安全的生鲜食材。</p>
            </div>
            <div class="footer-section">
                <h4>🔗 快速链接</h4>
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="index.html#products">商品展示</a></li>
                    <li><a href="orders.html">订单管理</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>📞 联系方式</h4>
                <p>客服电话：400-888-6666</p>
                <p>服务邮箱：support@freshdirect.com</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 鲜直达生鲜购物网站. 版权所有. | 课程作品 · 网络程序设计实践</p>
        </div>
    </footer>

    <div id="toast" class="toast"></div>
    <!-- 此处满足课程要求7：HTML/CSS/JS 分文件存放 -->
    <script src="script.js"></script>
</body>
</html>
