<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 鲜直达 · 生鲜购物网站</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥬</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 此处满足课程要求1：HTML5 语义化标签 header -->
    <header id="main-header">
        <div class="logo">
            <img src="images/logo.png" alt="生鲜购物网站Logo" loading="lazy">
            <h1>鲜直达</h1>
        </div>
        <!-- 此处满足课程要求1：HTML5 语义化标签 nav -->
        <nav id="navbar" class="nav-menu" aria-label="主导航">
            <a href="index.html">首页</a>
            <a href="index.html#products">商品展示</a>
            <a href="cart.html">购物车</a>
            <a href="orders.html">订单管理</a>
            <a href="login.html">登录</a>
            <a href="register.html" class="active">注册</a>
        </nav>
        <div class="header-actions">
            <div id="current-date" class="current-date"></div>
            <button id="dark-mode-toggle" type="button" aria-label="切换深色模式">🌙 夜间</button>
            <div id="user-status"></div>
        </div>
    </header>

    <!-- 此处满足课程要求1：HTML5 语义化标签 main -->
    <main>
        <!-- 此处满足课程要求1：使用 section 语义标签 -->
        <!-- 此处满足课程要求5-表单验证：完整验证 + :invalid/:valid 伪类实时反馈 -->
        <section class="form-section" aria-label="用户注册表单">
            <h2>📝 用户注册</h2>
            <!-- 此处满足课程要求1：HTML5 语义化标签 form -->
            <form id="register-form" novalidate>
                <label for="reg-username">用户名</label>
                <input type="text" id="reg-username" name="username" placeholder="3-16个字符"
                    autocomplete="username" required minlength="3" maxlength="16">
                <div class="field-hint" id="hint-username"></div>

                <label for="reg-email">邮箱</label>
                <input type="email" id="reg-email" name="email" placeholder="example@mail.com"
                    autocomplete="email" required>
                <div class="field-hint" id="hint-email"></div>

                <label for="reg-phone">手机号</label>
                <input type="tel" id="reg-phone" name="phone" placeholder="请输入11位手机号"
                    autocomplete="tel" pattern="^1[3-9]\d{9}$" required>
                <div class="field-hint" id="hint-phone"></div>

                <label for="reg-password">密码</label>
                <input type="password" id="reg-password" name="password" placeholder="至少6个字符"
                    autocomplete="new-password" required minlength="6">
                <div class="field-hint" id="hint-password"></div>

                <label for="confirm-password">确认密码</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="请再次输入密码"
                    autocomplete="new-password" required>
                <div class="field-hint" id="hint-confirm"></div>

                <button type="submit">✅ 注册</button>
            </form>
            <p>已有账户？<a href="login.html">立即登录 →</a></p>
        </section>
    </main>

    <!-- 此处满足课程要求1：HTML5 语义化标签 footer -->
    <!-- 此处满足课程要求6：版权信息 -->
    <footer role="contentinfo">
        <div class="footer-content">
            <div class="footer-section">
                <h4>🥬 关于鲜直达</h4>
                <p>鲜直达致力于为您提供最新鲜、最安全的生鲜食材。</p>
            </div>
            <div class="footer-section">
                <h4>🔗 快速链接</h4>
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="index.html#products">商品展示</a></li>
                    <li><a href="login.html">登录</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>📞 联系方式</h4>
                <p>客服电话：400-888-6666</p>
                <p>服务邮箱：support@freshdirect.com</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 鲜直达生鲜购物网站. 版权所有. | 课程作品 · 网络程序设计实践</p>
        </div>
    </footer>

    <div id="toast" class="toast"></div>
    <!-- 此处满足课程要求7：HTML/CSS/JS 分文件存放 -->
    <script src="script.js"></script>
</body>
</html>
