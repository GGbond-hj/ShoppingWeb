<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 - 鲜直达 · 生鲜购物网站</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥬</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 此处满足课程要求1：HTML5 语义化标签 header -->
    <header id="main-header">
        <div class="logo">
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
            <img src="images/logo.png" alt="生鲜购物网站Logo" loading="lazy">
            <h1>鲜直达</h1>
        </div>
        <!-- 此处满足课程要求1：HTML5 语义化标签 nav -->
        <nav id="navbar" class="nav-menu" aria-label="主导航">
            <a href="index.html">首页</a>
            <a href="index.html#products">商品展示</a>
            <a href="cart.html">购物车<span class="cart-badge" id="cart-badge" style="display:none">0</span></a>
            <a href="orders.html">订单管理</a>
            <a href="login.html">登录</a>
            <a href="register.html">注册</a>
        </nav>
        <div class="header-actions">
            <div id="current-date" class="current-date"></div>
            <button id="dark-mode-toggle" type="button" aria-label="切换深色模式">🌙 夜间</button>
            <div id="user-status"></div>
        </div>
    </header>

    <!-- 此处满足课程要求1：HTML5 语义化标签 main -->
    <main>
        <!-- 面包屑导航 -->
        <nav class="breadcrumb" aria-label="面包屑导航">
            <a href="index.html">首页</a>
            <span>/</span>
            <a href="index.html#products">商品展示</a>
            <span>/ 商品详情</span>
        </nav>

        <!-- 此处满足课程要求1：使用 section 语义标签 -->
        <section class="product-detail" aria-label="商品详情">
            <div id="product-detail-content">
                <!-- 此处满足课程要求6：大图+重量选择器+配送信息+标签页+底部固定栏 -->
                <!-- JS 动态渲染完整详情内容 -->
            </div>
        </section>

        <!-- 此处满足课程要求1：使用 aside 语义标签（相关推荐为侧边补充内容） -->
        <aside class="related-products" id="related-products" aria-label="相关推荐">
            <h3>🔗 相关推荐</h3>
            <div class="related-list" id="related-list">
                <!-- JS 动态渲染 -->
            </div>
        </aside>

        <!-- 返回按钮 -->
        <div class="detail-footer" style="text-align:center;margin-top:1.5rem;padding-bottom:80px;">
            <a class="hero-btn secondary" href="index.html#products">← 返回商品列表</a>
        </div>
    </main>

    <!-- 此处满足课程要求1：HTML5 语义化标签 footer -->
    <!-- 此处满足课程要求6：版权信息 -->
    <footer role="contentinfo">
        <div class="footer-content">
            <div class="footer-section">
                <h4>🥬 关于鲜直达</h4>
                <p>鲜直达致力于为您提供最新鲜、最安全的生鲜食材，直送到家。</p>
            </div>
            <div class="footer-section">
                <h4>🔗 快速链接</h4>
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="index.html#products">商品展示</a></li>
                    <li><a href="cart.html">购物车</a></li>
                    <li><a href="orders.html">订单管理</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>📞 联系方式</h4>
                <p>客服电话：400-888-6666</p>
                <p>服务邮箱：support@freshdirect.com</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 鲜直达生鲜购物网站. 版权所有. | 课程作品 · 网络程序设计实践</p>
        </div>
    </footer>

    <nav class="mobile-bottom-bar" aria-label="移动端导航">
        <a href="index.html"><span class="icon">🏠</span>首页</a>
        <a href="index.html#products"><span class="icon">🛍️</span>商品</a>
        <a href="cart.html"><span class="icon">🛒</span>购物车</a>
        <a href="orders.html"><span class="icon">📦</span>订单</a>
        <a href="login.html"><span class="icon">👤</span>我的</a>
    </nav>

    <div id="toast" class="toast"></div>
    <!-- 此处满足课程要求7：HTML/CSS/JS 分文件存放 -->
    <script src="script.js"></script>
</body>
</html>
